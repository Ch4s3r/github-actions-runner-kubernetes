name: Resource Check
on:
  workflow_dispatch:

jobs:
  check-resources:
    runs-on: arc-runner-set
    steps:
      - name: Host resources
        run: |
          echo "=== Runner Host Resources ==="
          echo "--- CPU ---"
          nproc
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "--- Memory ---"
          free -h
          echo "--- Cgroup limits ---"
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" = "max" ]; then
              echo "CPU limit: unlimited"
            else
              awk -v q="$quota" -v p="$period" 'BEGIN {printf "CPU limit: %.2f CPUs\n", q/p}'
            fi
          fi
          if [ -f /sys/fs/cgroup/memory.max ]; then
            mem=$(cat /sys/fs/cgroup/memory.max)
            if [ "$mem" = "max" ]; then
              echo "RAM limit: unlimited"
            else
              awk -v m="$mem" 'BEGIN {printf "RAM limit: %.2f GiB\n", m/1024/1024/1024}'
            fi
            used=$(cat /sys/fs/cgroup/memory.current)
            awk -v m="$used" 'BEGIN {printf "RAM used:  %.2f GiB\n", m/1024/1024/1024}'
          fi

      - name: Docker (dind) container resources
        run: |
          docker run --rm alpine:3 sh -c '
            echo "=== Docker Container Resources ===";
            echo "--- CPU ---";
            nproc;
            echo "--- Memory ---";
            free -h 2>/dev/null || cat /proc/meminfo | head -3;
            echo "--- Cgroup limits ---";
            read quota period < /sys/fs/cgroup/cpu.max;
            if [ "$quota" = "max" ]; then
              echo "CPU limit: unlimited";
            else
              awk -v q="$quota" -v p="$period" "BEGIN {printf \"CPU limit: %.2f CPUs\n\", q/p}";
            fi;
            mem=$(cat /sys/fs/cgroup/memory.max);
            if [ "$mem" = "max" ]; then
              echo "RAM limit: unlimited";
            else
              awk -v m="$mem" "BEGIN {printf \"RAM limit: %.2f GiB\n\", m/1024/1024/1024}";
            fi;
            used=$(cat /sys/fs/cgroup/memory.current);
            awk -v m="$used" "BEGIN {printf \"RAM used:  %.2f GiB\n\", m/1024/1024/1024}"
          '

      - name: Verify pod-level cgroup actually caps nested containers
        run: |
          echo "=== CPU throttling test: burn one busy-loop per host core for 8s, no package installs ==="
          before_throttled=$(awk '/^nr_throttled/{print $2}' /sys/fs/cgroup/cpu.stat)
          docker run --rm alpine:3 sh -c '
            for i in $(seq 1 $(nproc)); do
              ( while true; do :; done ) &
            done
            sleep 8
            kill $(jobs -p) 2>/dev/null
          '
          after_throttled=$(awk '/^nr_throttled/{print $2}' /sys/fs/cgroup/cpu.stat)
          echo "nr_throttled before=$before_throttled after=$after_throttled"
          echo "(increase proves the 4 CPU cap was enforced against $(nproc) host cores of demand)"
          cat /sys/fs/cgroup/cpu.stat

          echo "=== Memory limit test: write 12GiB into tmpfs (resident, non-reclaimable) against an 8Gi pod cap ==="
          set +e
          docker run --rm --shm-size=13g alpine:3 sh -c '
            dd if=/dev/zero of=/dev/shm/fill bs=1M count=12000
          '
          exit_code=$?
          set -e
          echo "nested container exit code: $exit_code (137 = OOM-killed, proves the 8Gi pod cap held; 0 would mean it was NOT capped)"
          echo "memory.events on the dind pod cgroup (oom/oom_kill > 0 confirms enforcement):"
          cat /sys/fs/cgroup/memory.events

name: Resource Check
on:
  workflow_dispatch:

jobs:
  check-resources:
    runs-on: arc-runner-set
    steps:
      - name: Host resources
        run: |
          echo "=== Runner Host Resources ==="
          echo "--- CPU ---"
          nproc
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "--- Memory ---"
          free -h
          echo "--- Cgroup limits ---"
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" = "max" ]; then
              echo "CPU limit: unlimited"
            else
              awk -v q="$quota" -v p="$period" 'BEGIN {printf "CPU limit: %.2f CPUs\n", q/p}'
            fi
          fi
          if [ -f /sys/fs/cgroup/memory.max ]; then
            mem=$(cat /sys/fs/cgroup/memory.max)
            if [ "$mem" = "max" ]; then
              echo "RAM limit: unlimited"
            else
              awk -v m="$mem" 'BEGIN {printf "RAM limit: %.2f GiB\n", m/1024/1024/1024}'
            fi
            used=$(cat /sys/fs/cgroup/memory.current)
            awk -v m="$used" 'BEGIN {printf "RAM used:  %.2f GiB\n", m/1024/1024/1024}'
          fi

      - name: Docker (dind) container resources
        run: |
          docker run --rm alpine:3 sh -c '
            echo "=== Docker Container Resources ===";
            echo "--- CPU ---";
            nproc;
            echo "--- Memory ---";
            free -h 2>/dev/null || cat /proc/meminfo | head -3;
            echo "--- Cgroup limits ---";
            read quota period < /sys/fs/cgroup/cpu.max;
            if [ "$quota" = "max" ]; then
              echo "CPU limit: unlimited";
            else
              awk -v q="$quota" -v p="$period" "BEGIN {printf \"CPU limit: %.2f CPUs\n\", q/p}";
            fi;
            mem=$(cat /sys/fs/cgroup/memory.max);
            if [ "$mem" = "max" ]; then
              echo "RAM limit: unlimited";
            else
              awk -v m="$mem" "BEGIN {printf \"RAM limit: %.2f GiB\n\", m/1024/1024/1024}";
            fi;
            used=$(cat /sys/fs/cgroup/memory.current);
            awk -v m="$used" "BEGIN {printf \"RAM used:  %.2f GiB\n\", m/1024/1024/1024}"
          '

      - name: Verify pod-level cgroup actually caps nested containers
        run: |
          echo "=== Install stress-ng once, reuse for both tests ==="
          docker run --rm alpine:3 sh -c 'apk update && apk add stress-ng && stress-ng --version'

          echo "=== CPU throttling test: demand all host cores for 15s inside a nested container ==="
          before_throttled=$(awk '/^nr_throttled/{print $2}' /sys/fs/cgroup/cpu.stat)
          docker run --rm alpine:3 sh -c '
            apk add --no-cache stress-ng
            echo "nproc inside nested container: $(nproc)"
            stress-ng --cpu 0 --cpu-method matrixprod --metrics-brief --timeout 15s
          '
          after_throttled=$(awk '/^nr_throttled/{print $2}' /sys/fs/cgroup/cpu.stat)
          echo "nr_throttled before=$before_throttled after=$after_throttled"
          echo "(increase proves the 4 CPU cap was enforced against the host core count of demand)"
          cat /sys/fs/cgroup/cpu.stat

          echo "=== Memory limit test: one worker touching 16GiB against an 8Gi pod cap, watched via docker stats (dind daemon's own accounting) ==="
          docker run -d --name memstress alpine:3 sh -c '
            apk add --no-cache stress-ng
            stress-ng --vm 1 --vm-bytes 16g --vm-keep --timeout 25s
          '
          for i in $(seq 1 25); do
            sleep 1
            status=$(docker inspect -f '{{.State.Status}}' memstress 2>/dev/null) || break
            docker stats --no-stream --format "t=${i}s {{.Name}} MemUsage={{.MemUsage}}" memstress 2>/dev/null
            [ "$status" = "running" ] || break
          done
          docker wait memstress >/dev/null 2>&1 || true
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' memstress)
          oom_killed=$(docker inspect -f '{{.State.OOMKilled}}' memstress)
          echo "exit_code=$exit_code oom_killed=$oom_killed"
          echo "(OOMKilled=true or a nonzero exit proves the 8Gi pod cap held against 16GiB of demand; OOMKilled=false with exit 0 would mean it was NOT capped)"
          docker rm -f memstress >/dev/null 2>&1 || true

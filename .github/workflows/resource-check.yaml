name: Resource Check
on:
  workflow_dispatch:

jobs:
  check-resources:
    runs-on: arc-runner-set
    steps:
      - name: Host resources
        run: |
          echo "=== Runner Host Resources ==="
          echo "--- CPU ---"
          nproc
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "--- Memory ---"
          free -h
          echo "--- Cgroup limits ---"
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" = "max" ]; then
              echo "CPU limit: unlimited"
            else
              awk -v q="$quota" -v p="$period" 'BEGIN {printf "CPU limit: %.2f CPUs\n", q/p}'
            fi
          fi
          if [ -f /sys/fs/cgroup/memory.max ]; then
            mem=$(cat /sys/fs/cgroup/memory.max)
            if [ "$mem" = "max" ]; then
              echo "RAM limit: unlimited"
            else
              awk -v m="$mem" 'BEGIN {printf "RAM limit: %.2f GiB\n", m/1024/1024/1024}'
            fi
            used=$(cat /sys/fs/cgroup/memory.current)
            awk -v m="$used" 'BEGIN {printf "RAM used:  %.2f GiB\n", m/1024/1024/1024}'
          fi

      - name: Docker (dind) container resources
        run: |
          docker run --rm alpine:3 sh -c '
            echo "=== Docker Container Resources ===";
            echo "--- CPU ---";
            nproc;
            echo "--- Memory ---";
            free -h 2>/dev/null || cat /proc/meminfo | head -3;
            echo "--- Cgroup limits ---";
            read quota period < /sys/fs/cgroup/cpu.max;
            if [ "$quota" = "max" ]; then
              echo "CPU limit: unlimited";
            else
              awk -v q="$quota" -v p="$period" "BEGIN {printf \"CPU limit: %.2f CPUs\n\", q/p}";
            fi;
            mem=$(cat /sys/fs/cgroup/memory.max);
            if [ "$mem" = "max" ]; then
              echo "RAM limit: unlimited";
            else
              awk -v m="$mem" "BEGIN {printf \"RAM limit: %.2f GiB\n\", m/1024/1024/1024}";
            fi;
            used=$(cat /sys/fs/cgroup/memory.current);
            awk -v m="$used" "BEGIN {printf \"RAM used:  %.2f GiB\n\", m/1024/1024/1024}"
          '

      - name: Verify pod-level cgroup actually caps nested containers
        run: |
          echo "=== CPU throttling test: burn all host CPUs from inside a nested container for 10s ==="
          docker run --rm alpine:3 sh -c '
            apk add --no-cache stress-ng >/dev/null 2>&1;
            stress-ng --cpu $(nproc) --cpu-method matrixprod --timeout 10 >/dev/null 2>&1
          '
          echo "cpu.stat on the dind pod cgroup (nonzero nr_throttled/throttled_usec proves the 4 CPU cap held):"
          cat /sys/fs/cgroup/cpu.stat

          echo "=== Memory limit test: try to allocate 12GiB inside a nested container against an 8Gi pod cap ==="
          set +e
          docker run --rm --memory=12g --memory-swap=12g alpine:3 sh -c '
            apk add --no-cache stress-ng >/dev/null 2>&1;
            stress-ng --vm 1 --vm-bytes 12G --vm-keep --timeout 10
          '
          exit_code=$?
          set -e
          echo "nested container exit code: $exit_code (137 = OOM-killed, proves the 8Gi pod cap held)"
          echo "memory.events on the dind pod cgroup (oom/oom_kill > 0 confirms enforcement):"
          cat /sys/fs/cgroup/memory.events

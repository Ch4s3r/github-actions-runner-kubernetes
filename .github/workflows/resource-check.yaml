name: Resource Check
on:
  workflow_dispatch:

jobs:
  check-resources:
    runs-on: arc-runner-set
    steps:
      - name: Host resources
        run: |
          echo "=== Runner Host Resources ==="
          echo "--- CPU ---"
          nproc
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "--- Memory ---"
          free -h
          echo "--- Cgroup limits ---"
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" = "max" ]; then
              echo "CPU limit: unlimited"
            else
              awk -v q="$quota" -v p="$period" 'BEGIN {printf "CPU limit: %.2f CPUs\n", q/p}'
            fi
          fi
          if [ -f /sys/fs/cgroup/memory.max ]; then
            mem=$(cat /sys/fs/cgroup/memory.max)
            if [ "$mem" = "max" ]; then
              echo "RAM limit: unlimited"
            else
              awk -v m="$mem" 'BEGIN {printf "RAM limit: %.2f GiB\n", m/1024/1024/1024}'
            fi
            used=$(cat /sys/fs/cgroup/memory.current)
            awk -v m="$used" 'BEGIN {printf "RAM used:  %.2f GiB\n", m/1024/1024/1024}'
          fi

      - name: Verify the dind sidecar's own cgroup caps nested docker containers
        run: |
          echo "=== Memory limit test: one worker touching 10GiB inside a nested docker container against the dind sidecar's own 10Gi cap ==="
          docker run -d --name memtest debian:bookworm-slim sh -c '
            apt-get update -qq && apt-get install -y -qq stress-ng >/dev/null
            stress-ng --vm 1 --vm-bytes 10g --vm-keep --timeout 60s
          '
          for i in $(seq 1 90); do
            sleep 2
            status=$(docker inspect -f '{{.State.Status}}' memtest 2>/dev/null) || break
            docker stats --no-stream --format "t=$((i*2))s {{.Name}} MemUsage={{.MemUsage}}" memtest 2>/dev/null
            [ "$status" = "running" ] || break
          done
          docker wait memtest >/dev/null 2>&1 || true
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' memtest 2>/dev/null)
          oom_killed=$(docker inspect -f '{{.State.OOMKilled}}' memtest 2>/dev/null)
          echo "exit_code=$exit_code oom_killed=$oom_killed"
          docker rm -f memtest >/dev/null 2>&1 || true
          if [ "$oom_killed" != "true" ]; then
            echo "::error::Nested docker container was NOT OOMKilled by the dind sidecar's 10Gi memory limit (oom_killed=$oom_killed, exit_code=$exit_code) — this reproduces the known dind cgroup-accounting bug (moby/moby#45378, kubernetes/kubernetes#119853): the nested container's memory usage escaped the sidecar's own cgroup entirely."
            exit 1
          fi
          echo "(OOMKilled=true proves the dind sidecar's 10Gi cap held against 10GiB of nested container demand)"

      - name: Install Podman
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq podman
          podman --version

      - name: Podman container resources
        run: |
          podman run --rm alpine:3 sh -c '
            echo "=== Podman Container Resources ===";
            echo "--- CPU ---";
            nproc;
            echo "--- Memory ---";
            free -h 2>/dev/null || cat /proc/meminfo | head -3;
            echo "--- Cgroup limits ---";
            read quota period < /sys/fs/cgroup/cpu.max;
            if [ "$quota" = "max" ]; then
              echo "CPU limit: unlimited";
            else
              awk -v q="$quota" -v p="$period" "BEGIN {printf \"CPU limit: %.2f CPUs\n\", q/p}";
            fi;
            mem=$(cat /sys/fs/cgroup/memory.max);
            if [ "$mem" = "max" ]; then
              echo "RAM limit: unlimited";
            else
              awk -v m="$mem" "BEGIN {printf \"RAM limit: %.2f GiB\n\", m/1024/1024/1024}";
            fi;
            used=$(cat /sys/fs/cgroup/memory.current);
            awk -v m="$used" "BEGIN {printf \"RAM used:  %.2f GiB\n\", m/1024/1024/1024}"
          '

      - name: Verify runner cgroup actually caps nested podman containers
        run: |
          echo "=== Install stress-ng once, reuse for both tests ==="
          podman run --rm alpine:3 sh -c 'apk update && apk add stress-ng && stress-ng --version'

          echo "=== CPU throttling test: demand all host cores for 15s inside a nested container ==="
          before_throttled=$(awk '/^nr_throttled/{print $2}' /sys/fs/cgroup/cpu.stat)
          podman run --rm alpine:3 sh -c '
            apk add --no-cache stress-ng
            echo "nproc inside nested container: $(nproc)"
            stress-ng --cpu 0 --cpu-method matrixprod --metrics-brief --timeout 15s
          '
          after_throttled=$(awk '/^nr_throttled/{print $2}' /sys/fs/cgroup/cpu.stat)
          echo "nr_throttled before=$before_throttled after=$after_throttled"
          echo "(increase proves the 4 CPU cap was enforced against the host core count of demand)"
          cat /sys/fs/cgroup/cpu.stat

          echo "=== Memory limit test: one worker touching 16GiB against an 8Gi runner cap, watched via podman stats ==="
          podman run -d --name memstress alpine:3 sh -c '
            apk add --no-cache stress-ng
            stress-ng --vm 1 --vm-bytes 16g --vm-keep --timeout 25s
          '
          for i in $(seq 1 25); do
            sleep 1
            status=$(podman inspect -f '{{.State.Status}}' memstress 2>/dev/null) || break
            podman stats --no-stream --format "t=${i}s {{.Name}} MemUsage={{.MemUsage}}" memstress 2>/dev/null
            [ "$status" = "running" ] || break
          done
          podman wait memstress >/dev/null 2>&1 || true
          exit_code=$(podman inspect -f '{{.State.ExitCode}}' memstress 2>/dev/null)
          oom_killed=$(podman inspect -f '{{.State.OOMKilled}}' memstress 2>/dev/null)
          echo "exit_code=$exit_code oom_killed=$oom_killed"
          echo "(OOMKilled=true or a nonzero exit proves the 8Gi runner cap held against 16GiB of demand; OOMKilled=false with exit 0 would mean it was NOT capped)"
          podman rm -f memstress >/dev/null 2>&1 || true

      - name: Verify the runner container's own cgroup enforces its resources.limits.memory
        run: |
          echo "=== Install stress-ng directly in the runner container (no nested podman this time) ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq stress-ng
          stress-ng --version

          echo "=== Memory limit test: one worker touching 6GiB directly against the runner container's own memory limit ==="
          stress-ng --vm 1 --vm-bytes 6g --vm-keep --timeout 20s &
          pid=$!
          for i in $(seq 1 20); do
            sleep 1
            cur=$(cat /sys/fs/cgroup/memory.current 2>/dev/null)
            awk -v m="$cur" -v t="$i" 'BEGIN {printf "t=%ss runner cgroup memory.current=%.2f GiB\n", t, m/1024/1024/1024}'
            kill -0 "$pid" 2>/dev/null || { echo "stress-ng process is gone at t=${i}s (likely OOM-killed by the runner container's own cgroup limit)"; break; }
          done
          wait "$pid"
          exit_code=$?
          echo "stress-ng exit_code=$exit_code"
          echo "(a nonzero/killed-by-signal exit code proves the runner container's resources.limits.memory was enforced against 6GiB of demand; exit_code=0 would mean it was NOT capped)"
